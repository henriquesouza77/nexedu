<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de aluno · NexEdu</title>
  <link rel="icon" href="../assets/img/favicon.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app" id="app">
    <main class="main">
      <header class="topbar" id="topbar"></header>
      <section class="content" id="content">
        <div class="card" style="max-width:960px;margin:0 auto">
          <div class="card__header">
            <div><h2 id="formTitle">Novo aluno</h2><p>Campos marcados com <span style="color:var(--primary)">*</span> são obrigatórios.</p></div>
            <a class="btn btn-secondary btn-sm" href="alunos.html">Voltar para a lista</a>
          </div>
          <form id="formAluno" novalidate>
            <div class="form-grid">
              <div class="field full"><label for="nome">Nome completo <span class="req">*</span></label><input class="input" id="nome" name="nome" placeholder="Ex.: Ana Beatriz da Silva"><small class="hint"></small></div>
              <div class="field"><label for="matricula">Matrícula <span class="req">*</span></label><input class="input" id="matricula" name="matricula" placeholder="Ex.: 2026019"><small class="hint"></small></div>
              <div class="field"><label for="nascimento">Data de nascimento <span class="req">*</span></label><input class="input" type="date" id="nascimento" name="nascimento"><small class="hint"></small></div>
              <div class="field"><label for="email">E-mail <span class="req">*</span></label><input class="input" type="email" id="email" name="email" placeholder="aluno@nexedu.com"><small class="hint"></small></div>
              <div class="field"><label for="telefone">Telefone</label><input class="input" id="telefone" name="telefone" placeholder="(11) 90000-0000"><small class="hint"></small></div>
              <div class="field"><label for="turmaId">Turma <span class="req">*</span></label><select class="select" id="turmaId" name="turmaId"></select><small class="hint"></small></div>
              <div class="field"><label for="curso">Curso <span class="req">*</span></label><input class="input" id="curso" name="curso" placeholder="Preenchido pela turma"><small class="hint"></small></div>
              <div class="field"><label for="periodo">Período <span class="req">*</span></label><select class="select" id="periodo" name="periodo"><option value="">Selecione</option><option>Manhã</option><option>Tarde</option><option>Noite</option></select><small class="hint"></small></div>
              <div class="field"><label for="situacao">Situação <span class="req">*</span></label><select class="select" id="situacao" name="situacao"><option>Ativo</option><option>Inativo</option><option>Transferido</option><option>Concluído</option></select><small class="hint"></small></div>
              <div class="field"><label for="responsavel">Nome do responsável <span class="req">*</span></label><input class="input" id="responsavel" name="responsavel"><small class="hint"></small></div>
              <div class="field"><label for="telResponsavel">Telefone do responsável <span class="req">*</span></label><input class="input" id="telResponsavel" name="telResponsavel" placeholder="(11) 90000-0000"><small class="hint"></small></div>
            </div>
            <div class="form-actions">
              <a class="btn btn-secondary" href="alunos.html">Cancelar</a>
              <button class="btn btn-primary" type="submit" id="btnSalvar">Salvar aluno</button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/aluno-cadastro.js"></script>
</body>
</html>
